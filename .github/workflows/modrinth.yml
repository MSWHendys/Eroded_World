name: Publish to Modrinth

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew clean build --no-daemon

      - name: List build output
        run: ls -lah build/libs

      - name: Find built JAR
        id: findjar
        shell: bash
        run: |
          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No release JAR found in build/libs."
            exit 1
          fi

          echo "Found JAR: $JAR_FILE"
          echo "jar_path=$JAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Detect release type
        id: releasetype
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"

          if [[ "$TAG" == *alpha* ]]; then
            echo "type=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *beta* ]]; then
            echo "type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: lvxpnYQB
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: ${{ steps.findjar.outputs.jar_path }}

          name: Eroded World ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: ${{ steps.releasetype.outputs.type }}

          changelog: ${{ github.event.release.body }}

          game-versions: |
            26.1
            26.1.1
            26.1.2

          loaders: |
            fabric

          environment: client | server
