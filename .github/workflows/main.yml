name: Publish CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew clean build --no-daemon

      - name: List build output
        run: ls -lah build/libs

      - name: Find built JAR
        id: findjar
        shell: bash
        run: |
          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No release JAR found in build/libs."
            exit 1
          fi

          echo "Found JAR: $JAR_FILE"
          echo "jar_path=$JAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Detect release type
        id: releasetype
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"

          if [[ "$TAG" == *alpha* ]]; then
            echo "type=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *beta* ]]; then
            echo "type=beta" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: 1460705
          game_endpoint: minecraft
          file_path: ${{ steps.findjar.outputs.jar_path }}
          release_type: ${{ steps.releasetype.outputs.type }}
          display_name: Eroded World ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          changelog_type: markdown
          game_versions: "Minecraft 26.1:26.1,Minecraft 26.1:26.1.1,Minecraft 26.1:26.1.2,Fabric,Client,Server,Java 25"
