name: Build & Release GitHub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew clean build --no-daemon

      - name: List build output
        run: ls -lah build/libs

      - name: Find built JAR
        id: jar
        shell: bash
        run: |
          JAR_PATH=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-javadoc.jar" \
            | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "No release JAR found in build/libs."
            exit 1
          fi

          echo "Found JAR: $JAR_PATH"
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload JAR
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.jar.outputs.jar_path }}
          name: Eroded World ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
