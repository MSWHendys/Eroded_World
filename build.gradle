plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Mojang mappings
    mappings loom.officialMojangMappings()

    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
    def projectVersion = project.version.toString()
    def minecraftRange = project.minecraft_range.toString()
    def loaderRange = project.loader_range.toString()
    def fabricApiRange = project.fabric_api_range.toString()
    def clothConfigRange = project.cloth_config_range.toString()

    inputs.property "version", projectVersion
    inputs.property "minecraft_range", minecraftRange
    inputs.property "loader_range", loaderRange
    inputs.property "fabric_api_range", fabricApiRange
    inputs.property "cloth_config_range", clothConfigRange

    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                version: projectVersion,
                minecraft_range: minecraftRange,
                loader_range: loaderRange,
                fabric_api_range: fabricApiRange,
                cloth_config_range: clothConfigRange
        )
    }
}

def targetJavaVersion = 21

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)

    if (JavaVersion.current() < javaVersion) {
        toolchain {
            languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }

    withSourcesJar()
}

jar {
    def archiveName = project.archives_base_name.toString()

    inputs.property "archiveName", archiveName

    from("LICENSE") {
        rename { fileName ->
            "${fileName}_${archiveName}"
        }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Sem případně přijde repozitář pro publikování.
    }
}